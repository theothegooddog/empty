# Optional: a regular Xcode project that also runs the unit tests.
# The easiest way to run the app is to open EarlyBird.swiftpm instead.
# Generate EarlyBird.xcodeproj with XcodeGen: `brew install xcodegen && xcodegen`
name: EarlyBird
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  EarlyBird:
    type: application
    platform: iOS
    sources:
      - path: EarlyBird.swiftpm
        excludes: [Package.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.EarlyBird
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Early Bird
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Early Bird checks that you're at school when you check in, so your streak is the real deal.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
  EarlyBirdTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: EarlyBird
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  EarlyBird:
    build:
      targets:
        EarlyBird: all
    test:
      targets: [EarlyBirdTests]
