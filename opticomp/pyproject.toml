[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "opticomp"
version = "0.1.0"
description = "Optimize a Python script in memory and run the optimized copy - just `import opticomp`."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools]
packages = ["opticomp"]
